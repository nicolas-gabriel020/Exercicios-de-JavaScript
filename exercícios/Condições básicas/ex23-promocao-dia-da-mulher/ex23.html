<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex23.css">
</head>

<body>

    <main class="card">

        <header>
            <h1>Título do Exercício</h1>
        </header>

        <section class="inputs">

            <p>
                Digite seu sexo 
                <br>
                <input type="radio" name="redsex" id="masc" checked>
                <label for="masc">Masculino</label>
                <input type="radio" name="redsex" id="fem">
                <label for="fem">Feminino</label>
            </p>

            <label for="nome">Digite seu nome</label>
            <input type="text" id="nome">

            <label for="compra">Digite o valor da sua compra</label>
            <input type="number" id="compra">

        </section>

        <section class="acoes">
            <button id="botao">
                Calcular
            </button>
        </section>

        <section class="resultado">
            <p id="res">
                Aguardando dados...
            </p>
        </section>

    </main>

    <script src="ex23.js"></script>

</body>
</html>

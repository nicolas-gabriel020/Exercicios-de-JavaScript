<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex67.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Contagem</h1>
        </header>

        <section class="dados">

            <p>
                <label for="valor">
                    Digite um valor: <input type="number" id="valor">
                </label>
            </p>

        </section>

        <section class="controles">

            <button id="executar">
                Iniciar contagem
            </button>

            <button id="limpar">
                Limpar contagem
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex67.js"></script>

</body>
</html>

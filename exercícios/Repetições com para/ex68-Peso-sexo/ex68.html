<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex68.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Cadastro de pessoas</h1>
        </header>

        <section class="dados">
            
            <p>
                Escolha seu sexo:
            </p>

            <label>
                <input type="radio" name="genero" id="homem" checked>
                Homem
            </label>

            <label>
                <input type="radio" name="genero" id="mulher">
                Mulher
            </label>
            <br>
            <label for="peso">
                Digite seu peso em Quilos
            </label>

            <input type="number" id="peso">

        </section>

        <section class="controles">

            <button id="executar">
                Adicionar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex68.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex69.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Progressão aritmética</h1>
        </header>

        <section class="dados">

            <label for="termo">
                Digite o primeiro termo da PA
            </label>

            <input type="number" id="termo">

            <label for="razao">
                Digite a razão da PA
            </label>

            <input type="number" id="razao">

        </section>

        <section class="controles">

            <button id="executar">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex69.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex66.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Tabuada</h1>
        </header>

        <section class="dados">

            <div id="div1">
                <p>
                    Número: <input type="number" id="numero">
                    <button id="gerador">Gerar tabuada</button>
                </p>
            </div>

            <div id="div2">
                <select name="tabuada" id="seltab" size="10">
                    <option>Digite um número acima!</option>
                </select>
            </div>

        </section>

        <section class="controles">

            <button id="limpar">
                Limpar tabuada
            </button>

        </section>

    </main>

    <script src="ex66.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex34.css">
</head>
<body>

    <main class="painel">

        <h1>Analisador de IMC</h1>

        <section class="dados">

            <p>
                Digite sua altura e peso
                <br><br>
                <label for="altura">Altura (m):</label>
                <input type="number" id="altura">
                <br><br>
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso">
            </p>

        </section>

        <section class="controles">

            <button id="botao">Analisar</button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <p id="res">
                Aguardando análise...
            </p>

        </section>

    </main>

    <script src="ex34.js"></script>

</body>
</html>

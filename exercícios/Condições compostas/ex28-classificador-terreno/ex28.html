<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex28.css">
</head>
<body>

    <main class="painel">

        <h1>Analisador de terreno</h1>

        <section class="dados">

            <label for="largura">Largura (m)</label>
            <input type="number" id="largura" min="1">

            <label for="comprimento">Comprimento (m)</label>
            <input type="number" id="comprimento" min="1">

        </section>

        <section class="controles">

            <button id="botao">Analisar</button>

        </section>

        <section class="saida">

            <h2>Classificação do terreno</h2>

            <p id="res">
                Aguardando análise...
            </p>

        </section>

    </main>

    <script src="ex28.js"></script>

</body>
</html>

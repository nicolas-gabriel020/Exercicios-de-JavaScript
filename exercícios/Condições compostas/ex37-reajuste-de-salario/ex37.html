<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex37.css">
</head>
<body>

    <main class="painel">

        <h1>Reajuste salarial</h1>

        <section class="dados">

            <label for="nome">Digite seu nome</label>
            <input type="text" id="nome">

            <label for="salario">Digite seu salário atual</label>
            <input type="number" id="salario">

            <div class="opcao">
                <input type="radio" name="sexo" id="fem" checked>
                <label for="fem">Mulher</label>
            </div>

            <div class="opcao">
                <input type="radio" name="sexo" id="masc">
                <label for="masc">Homem</label>
            </div>

            <label for="anos">Anos de empresa</label>
            <input type="number" id="anos">

        </section>

        <section class="controles">

            <button id="botao">Analisar</button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <p id="res">
                Aguardando análise...
            </p>

        </section>

    </main>

    <script src="ex37.js"></script>

</body>
</html>

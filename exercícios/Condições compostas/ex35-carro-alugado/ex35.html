<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex35.css">
</head>
<body>

    <main class="painel">

        <h1>Aluguel de carros</h1>

        <section class="dados">

            <div class="opcao">
                <input type="radio" name="tipo" id="carro_popular" checked>
                <label for="carro_popular">Carro popular</label>
            </div>

            <div class="opcao">
                <input type="radio" name="tipo" id="carro_luxo">
                <label for="carro_luxo">Carro de luxo</label>
            </div>
            <label for="dias">Dias alugados</label>
            <input type="number" id="dias">

            <label for="quilometros">Quilometros percorridos</label>
            <input type="number" id="quilometros">

        </section>

        <section class="controles">

            <button id="botao">Analisar</button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <p id="res">
                Aguardando análise...
            </p>

        </section>

    </main>

    <script src="ex35.js"></script>

</body>
</html>

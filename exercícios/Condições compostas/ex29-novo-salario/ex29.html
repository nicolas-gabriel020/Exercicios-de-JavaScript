<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex29.css">
</head>
<body>

    <main class="painel">

        <h1>Analisador de salário</h1>

        <section class="dados">

            <label for="nome">Digite seu nome</label>
            <input type="text" id="nome">

            <label for="salario">Digite seu salário atual</label>
            <input type="number" id="salario" min="0">

            <label for="anos">Digite quantos anos você trabalha na empresa</label>
            <input type="number" id="anos" min="0">

        </section>

        <section class="controles">

            <button id="botao">Analisar</button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <p id="res">
                Aguardando análise...
            </p>

        </section>

    </main>

    <script src="ex29.js"></script>

</body>
</html>

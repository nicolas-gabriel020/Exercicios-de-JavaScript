<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex97.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Maior número</h1>
        </header>

        <section class="dados">

            <label for="valor1">
                Digite o 1 valor:
                <input type="number" id="valor1">
            </label>

            <label for="valor2">
                Digite o 2 valor:
                <input type="number" id="valor2">
            </label>

            <label for="valor3">
                Digite o 3 valor:
                <input type="number" id="valor3">
            </label>
        </section> 

        <section class="controles">

            <button id="executar">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex97.js"></script>

</body>
</html>

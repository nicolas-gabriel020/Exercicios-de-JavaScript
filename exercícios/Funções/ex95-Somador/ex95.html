<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex95.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Somador</h1>
        </header>

        <section class="dados">

            <label for="valor1">
                Digite um valor
            </label>

            <input type="number" id="valor1">

            <label for="valor2">
                Digite o segundo valor
            </label>

            <input type="number" id="valor2">
        </section>

        <section class="controles">

            <button id="executar">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex95.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex78.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Multiplos de 10</h1>
        </header>

        <section class="dados">

            <p>
                Digite 15 números e veja quais são multiplos de 10.
            </p>

            <label for="valor" id="valores">
                Digite o 1º valor
            </label>

            <input type="number" id="valor">

        </section>

        <section class="controles">

            <button id="executar">
                Adicionar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex78.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex77.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Cadastro de pessoas</h1>
        </header>

        <section class="dados">

            <label for="nome">
                Digite o 1º nome
            </label>

            <input type="text" id="nome">

        </section>

        <section class="controles">

            <button id="executar">
                Adicionar nome
            </button>

            <button id="limpar">
                Limpar nomes
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Cadastre 7 pessoas para concluir.
            </div>

        </section>

    </main>

    <script src="ex77.js"></script>

</body>
</html>

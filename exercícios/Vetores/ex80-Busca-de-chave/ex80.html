<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex80.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Adivinhe a chave</h1>
        </header>

        <section class="dados">

            <p>
                Digite um número de 1 a 15
            </p>
            <label for="valor">
                Digite a chave
            </label>

            <input type="number" id="valor" max="15" min="1">

        </section>

        <section class="controles">

            <button id="executar">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex80.js"></script>

</body>
</html>

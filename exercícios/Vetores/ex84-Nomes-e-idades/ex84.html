<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex84.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Cadastro</h1>
        </header>

        <section class="dados">

            <p>Cadastre 9 pessoas no programa.</p>

            <label for="nome">
                Nome:
                <input type="text" id="nome">
            </label>

            <label for="idade">
                Idade:
                <input type="number" id="idade">
            </label>

            <p id="pessoa">0 pessoas cadastradas</p>

        </section>

        <section class="controles">

            <button id="cadastrar">
                Cadastrar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex84.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex53.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Estatísticas de pessoas</h1>
        </header>

        <section class="dados">

            <label for="idade" id="tempo">
                Digite a idade da 1ª 
            </label>

            <input type="number" id="idade">

            <p>
                Qual seu gênero: <br>
                <input type="radio" name="genero" id="masc" checked>
                <label for="masc">Homem</label>

                <input type="radio" name="genero" id="fem">
                <label for="fem">Mulher</label>
            </p>

        </section>

        <section class="controles">

            <button id="botao">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex53.js"></script>

</body>
</html>

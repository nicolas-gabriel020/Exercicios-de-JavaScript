<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex45.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Contador configurável</h1>
        </header>

        <section class="dados">

            <label for="inicio">Digite o número de inicio</label>
            <input type="number" id="inicio">

            <label for="fim">Digite o número final</label>
            <input type="number" id="fim">

            <label for="incremento">Digite o número de incremento</label>
            <input type="number" id="incremento">

        </section>

        <section class="controles">

            <button id="botao">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex45.js"></script>

</body>
</html>

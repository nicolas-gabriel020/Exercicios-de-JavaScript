<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex47.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Acumulador decrescente</h1>
        </header>

        <section class="descricao">

            <p>
                Clique em Executar para calcular a soma de 500 até 0, diminuindo de 50 em 50.
            </p>

        </section>

        <section class="controles">

            <button id="botao">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex47.js"></script>

</body>
</html>

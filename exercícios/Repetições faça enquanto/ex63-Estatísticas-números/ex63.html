<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex63.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Estatísticas de números</h1>
        </header>

        <section class="dados">

            <label for="valor" id="numeros">
                Digite o 1º número
            </label>

            <input type="number" id="valor">

        </section>

        <section class="controles">

            <button id="adicionar">
                Adicionar número
            </button>

            <button id="finalizar">
                Finalizar execução
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex63.js"></script>

</body>
</html>

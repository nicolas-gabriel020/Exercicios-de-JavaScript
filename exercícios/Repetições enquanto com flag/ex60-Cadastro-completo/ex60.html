<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex60.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Cadastro completo de pessoas</h1>
        </header>

        <section class="dados">

            <label for="nome">
                Digite seu nome
            </label>

            <input type="text" id="nome">

            <label for="idade">
                Digite sua idade
            </label>

            <input type="number" id="idade">

            <label>
                <input type="radio" name="sexo" id="homem" checked>
                Homem
            </label>

            <label>
                <input type="radio" name="sexo" id="mulher">
                Mulher
            </label>

        </section>

        <section class="controles">

            <button id="cadastrar">
                Cadastrar
            </button>

            <br><br>
            
            <button id="finalizar">
                Finalizar cadastro
            </button>
        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex60.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex56.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Soma de valores</h1>
        </header>

        <section class="dados">

            <p id="posicao">
                Digite o 1º número
            </p>

            <input type="number" id="valor">

        </section>

        <section class="controles">

            <button id="botao">
                Executar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
                <br><br>
                Observação: Ao digitar o número 1111 e executar a sequência se encerra
            </div>

        </section>

    </main>

    <script src="ex56.js"></script>

</body>
</html>

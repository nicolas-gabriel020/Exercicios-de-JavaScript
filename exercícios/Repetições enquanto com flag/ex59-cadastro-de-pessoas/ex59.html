<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex59.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Cadastro de pessoas</h1>
        </header>

        <section class="dados">

            <label for="idade">
                Digite sua idade
            </label>

            <input type="number" id="idade">

            <label>
                <input type="radio" name="sexo" id="homem" checked>
                Homem
                <br>
                <input type="radio" name="sexo" id="mulher">
                Mulher
            </label>

        </section>

        <section class="controles">

            <button id="botao">
                Cadastrar
            </button>
            <br><br>
            <button id="resultado">
                Finalizar cadastro
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando finalização do cadastro...
            </div>

        </section>

    </main>

    <script src="ex59.js"></script>

</body>
</html>

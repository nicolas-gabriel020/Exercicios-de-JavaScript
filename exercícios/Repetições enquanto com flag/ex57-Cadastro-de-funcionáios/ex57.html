<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex57.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Controle de salários</h1>
        </header>

        <section class="dados">

            <label for="salario">Digite seu salário abaixo</label>
            <input type="number" id="salario">
            <br>
            <label>
                <input type="radio" name="genero" id="fem" checked>
                Mulher
            </label>
            
            <label>
                <input type="radio" name="genero" id="masc">
                Homem
            </label>

        </section>

        <section class="controles">

            <button id="botao">
                Cadastrar
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
            </div>

        </section>

    </main>

    <script src="ex57.js"></script>

</body>
</html>

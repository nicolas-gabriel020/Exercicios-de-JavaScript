<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JavaScript</title>

    <link rel="stylesheet" href="ex58.css">
</head>
<body>

    <main class="painel">

        <header>
            <h1>Cadastro de alunos</h1>
        </header>

        <section class="dados">

            <label for="idade" id="aluno">
                Digite a idade do 1º aluno
            </label>

            <input type="number" id="idade">

        </section>

        <section class="controles">

            <button id="botao">
                Adicionar cadastro
            </button>

        </section>

        <section class="saida">

            <h2>Resultado</h2>

            <div id="res">
                Aguardando execução...
                <br>
                Obs: ao digitar 999 o programa se encerra
            </div>

        </section>

    </main>

    <script src="ex58.js"></script>

</body>
</html>
